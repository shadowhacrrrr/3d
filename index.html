<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SHADOW OFFICIAL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050508;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            color: #0ff;
        }
        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;

        }

        /* Hamburger Menu */
        #hamburger {
            position: fixed;
            top: 20px; right: 20px;

            cursor: pointer;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        #hamburger span {
            display: block;
            width: 100%; height: 3px;
            background: #0ff;
            box-shadow: 0 0 8px #0ff, 0 0 16px #0ff;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        #hamburger:hover span {
            background: #f0f;
            box-shadow: 0 0 12px #f0f, 0 0 24px #f0f;
        }

        /* Owner Button */
        #owner-btn {
            position: fixed;
            top: 60px; right: 20px;
            padding: 10px 20px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #0ff;
            color: #0ff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            z-index: 1000;
            display: none;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        #owner-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        /* Login Panel */
        #login-panel {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 5, 8, 0.95);
            border: 1px solid #0ff;
            padding: 40px;
            z-index: 2000;
            display: none;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.2);
            min-width: 320px;
        }
        #login-panel h2 {
            color: #0ff;
            margin-bottom: 30px;
            text-align: center;
            font-size: 18px;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #0ff;
        }
        #login-panel input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid #0ff;
            color: #0ff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            outline: none;
        }
        #login-panel input::placeholder { color: rgba(0, 255, 255, 0.4); }
        #login-panel input:focus {
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }
        #login-panel button {
            width: 100%;
            padding: 12px;
            background: rgba(0, 255, 255, 0.15);
            border: 1px solid #0ff;
            color: #0ff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            letter-spacing: 3px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        #login-panel button:hover {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }
        #login-error {
            color: #f44;

            cursor: pointer;
            opacity: 0.6;
        }

        /* Admin Panel */
        #admin-panel {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);

            border: 1px solid #0ff;
            padding: 30px;
            z-index: 2000;

            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        #admin-panel h2 {
            color: #0ff;
            margin-bottom: 25px;
            text-align: center;
            font-size: 16px;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #0ff;
        }
        #admin-panel .form-group {
            margin-bottom: 20px;
        }
        #admin-panel label {
            display: block;
            color: #0ff;
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 8px;

        }
        #admin-panel input, #admin-panel textarea {

            border: 1px solid rgba(0, 255, 255, 0.3);

        #admin-panel input:focus, #admin-panel textarea:focus {

        }
        #admin-panel textarea { min-height: 80px; resize: vertical; }
        #admin-panel button {
            padding: 10px 25px;
            background: rgba(0, 255, 255, 0.15);
            border: 1px solid #0ff;
            color: #0ff;
            font-family: 'Courier New', monospace;

            letter-spacing: 2px;

        #admin-panel button:hover {

        }
        #links-list {
            margin-top: 25px;
            border-top: 1px solid rgba(0, 255, 255, 0.2);

        }
        #links-list h3 {

            font-size: 12px;

        }
        .link-item {
            background: rgba(0, 255, 255, 0.03);
            border: 1px solid rgba(0, 255, 255, 0.15);
            padding: 12px;
            margin-bottom: 10px;
            display: flex;

        }
        .link-item img {

        .link-item .info { flex: 1; }

        /* UI Controls */
        #ui-controls {

            bottom: 20px; left: 20px;

            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 20px;

            backdrop-filter: blur(10px);

        #ui-controls h3 {
            color: #0ff;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 8px #0ff;
        }
        .control-group {

        }
        .control-group label {
            display: block;
            color: rgba(0, 255, 255, 0.7);

        /* Stats */
        #stats {
            position: fixed;
            top: 20px; left: 20px;
            color: rgba(0, 255, 255, 0.5);
            font-size: 10px;
            letter-spacing: 1px;
            z-index: 100;
            pointer-events: none;
        }

        /* Scanline overlay */
        #scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;

<body>

    <button id="owner-btn">Owner Access</button>

    <div id="login-panel">

        <h2>// ADMIN PANEL</h2>
        <div class="form-group">

    <div id="ui-controls">
        <h3>// Parameters</h3>

        <div class="control-group">

        <div class="mode-buttons">
            <button class="mode-btn active" data-mode="0">Standard</button>

        </div>
    </div>

    <div id="stats">
        <div id="fps">FPS: --</div>
        <div id="res">RES: --</div>
    </div>

<script>
// ============================================================
// CYBERFRACTAL - GPU Optimized WebGL Fractal Renderer
// ============================================================

// ---- Configuration & State ----
const CONFIG = {
    maxIterations: 8,
    fractalPower: 8.0,
    colorIntensity: 1.2,
    zoomSpeed: 0.3,
    bloomStrength: 0.4,
    renderMode: 0, // 0=standard, 1=neon, 2=wireframe
    maxRaySteps: 128,
    minDist: 0.0001,
    maxDist: 60.0,
    shadowSoftness: 16.0,
    aoStrength: 0.8,
    fogDensity: 0.15,
    timeScale: 0.15
};

// Camera state with inertia
const camera = {
    pos: [2.5, 1.5, 2.5],
    target: [0, 0, 0],
    up: [0, 1, 0],
    fov: 60,
    // Inertia
    rotVel: [0, 0],
    zoomVel: 0,
    panVel: [0, 0],
    // Current angles
    theta: 0.785,
    phi: 0.615,
    radius: 4.0,
    // Target values (for smoothing)
    targetTheta: 0.785,
    targetPhi: 0.615,
    targetRadius: 4.0,
    targetCenter: [0, 0, 0]
};

// Input state
const input = {
    mouseDown: false,
    rightMouseDown: false,
    lastX: 0, lastY: 0,
    touchCount: 0,
    touchDist: 0
};

// Timing
let lastTime = 0;
let frameCount = 0;
let fpsTime = 0;
let currentFPS = 60;

// WebGL context
let gl, canvas;
let program, postProgram;
let frameBuffer, frameTexture;
let quadVBO;

// Uniform locations
let uTime, uResolution, uCameraPos, uCameraTarget, uCameraUp;
let uConfig, uMode;
let postUTexture, postUResolution, postUConfig, postUTime;

// Admin data
let savedLinks = JSON.parse(localStorage.getItem('cyberfractal_links') || '[]');

// ============================================================
// SHADER CODE
// ============================================================

// ---- Vertex Shader (Shared) ----
const VERTEX_SHADER = `
precision highp float;
attribute vec2 a_position;
varying vec2 v_uv;
void main() {
    v_uv = a_position * 0.5 + 0.5;
    gl_Position = vec4(a_position, 0.0, 1.0);
}
`;

// ---- Main Fragment Shader ----
const FRAGMENT_SHADER = `
precision highp float;

uniform float u_time;
uniform vec2 u_resolution;
uniform vec3 u_cameraPos;
uniform vec3 u_cameraTarget;
uniform vec3 u_cameraUp;
uniform vec4 u_config; // x=iterations, y=power, z=colorIntensity, z=bloom
uniform int u_mode;

varying vec2 v_uv;

// Constants
#define PI 3.14159265359
#define MAX_STEPS 128
#define MIN_DIST 0.0001
#define MAX_DIST 60.0
#define EPSILON 0.0005

// ---- Utility Functions ----
mat3 lookAt(vec3 eye, vec3 target, vec3 up) {
    vec3 f = normalize(target - eye);
    vec3 s = normalize(cross(f, up));
    vec3 u = cross(s, f);
    return mat3(s, u, -f);
}

vec3 rotateY(vec3 p, float a) {
    float c = cos(a), s = sin(a);
    return vec3(c*p.x + s*p.z, p.y, -s*p.x + c*p.z);
}

// ---- Distance Estimation: Mandelbulb ----
// Optimized using the "unrolled" approach with early exit
float mandelbulbDE(vec3 pos, float power, int iterations) {
    vec3 z = pos;
    float dr = 1.0;
    float r = 0.0;
    float theta, phi, zr;

    // Time-based animation
    float anim = sin(u_time * 0.3) * 0.1;
    float p = power + anim;

    for (int i = 0; i < 12; i++) {
        if (i >= iterations) break;

        r = length(z);
        if (r > 6.0) break;

        // Convert to polar
        theta = acos(clamp(z.z / r, -1.0, 1.0));
        phi = atan(z.y, z.x);

        dr = pow(r, p - 1.0) * p * dr + 1.0;

        // Scale and rotate
        zr = pow(r, p);
        theta = theta * p;
        phi = phi * p;

        z = zr * vec3(
            sin(theta) * cos(phi),
            sin(theta) * sin(phi),
            cos(theta)
        );
        z += pos;
    }

    return 0.5 * log(r) * r / dr;
}

// ---- Scene Distance ----
float sceneDE(vec3 p) {
    // Rotate scene slowly
    p = rotateY(p, u_time * 0.05);

    float d = mandelbulbDE(p, u_config.y, int(u_config.x));

    // Add a floor plane for reflections
    float floorDist = p.y + 2.0;

    return min(d, floorDist);
}

// ---- Analytic Normal (tetrahedron method - 4 samples vs 6) ----
vec3 calcNormal(vec3 p) {
    vec2 e = vec2(EPSILON, -EPSILON);
    vec4 v = vec4(
        sceneDE(p + e.xyy),
        sceneDE(p + e.yxy),
        sceneDE(p + e.yyx),
        sceneDE(p + e.xxx)
    );
    return normalize(vec3(
        v.x + v.y - v.z - v.w,
        v.x - v.y + v.z - v.w,
        v.x - v.y - v.z + v.w
    ));
}

// ---- Soft Shadows ----
float softShadow(vec3 ro, vec3 rd, float mint, float maxt, float k) {
    float res = 1.0;
    float t = mint;
    float ph = 1e10;

    for (int i = 0; i < 32; i++) {
        if (t >= maxt) break;
        float h = sceneDE(ro + rd * t);

        // Optimized soft shadow using penumbra width
        float y = h * h / (2.0 * ph);
        float d = sqrt(h * h - y * y);
        res = min(res, k * d / max(0.0, t - y));
        ph = h;

        t += clamp(h, 0.02, 0.5);
        if (res < 0.01) break;
    }
    return clamp(res, 0.0, 1.0);
}

// ---- Ambient Occlusion ----
float calcAO(vec3 p, vec3 n) {
    float occ = 0.0;
    float sca = 1.0;

    for (int i = 0; i < 5; i++) {
        float h = 0.01 + 0.12 * float(i) / 4.0;
        float d = sceneDE(p + h * n);
        occ += (h - d) * sca;
        sca *= 0.95;
        if (occ > 0.35) break;
    }
    return clamp(1.0 - 3.0 * occ, 0.0, 1.0) * (0.5 + 0.5 * n.y);
}

// ---- Cyberpunk Color Palette ----
vec3 cyberColor(float t, vec3 normal, vec3 pos) {
    float intensity = u_config.z;

    // Base colors: cyan, magenta, deep blue
    vec3 c1 = vec3(0.0, 0.8, 1.0); // Cyan
    vec3 c2 = vec3(1.0, 0.0, 0.6); // Magenta
    vec3 c3 = vec3(0.1, 0.0, 0.4); // Deep blue
    vec3 c4 = vec3(0.0, 1.0, 0.4); // Neon green

    // Pattern-based coloring
    float pattern = sin(pos.x * 3.0 + u_time * 0.5) * 
                    sin(pos.y * 3.0 + u_time * 0.3) * 
                    sin(pos.z * 3.0 + u_time * 0.7);
    pattern = pattern * 0.5 + 0.5;

    // Distance from center gradient
    float dist = length(pos);
    float grad = sin(dist * 2.0 - u_time * 0.4) * 0.5 + 0.5;

    // Normal-based coloring
    float nDot = dot(normal, vec3(0.577));

    vec3 col = mix(c1, c2, pattern);
    col = mix(col, c3, grad * 0.5);
    col = mix(col, c4, nDot * 0.3);

    // Neon pulse
    float pulse = sin(u_time * 1.5) * 0.5 + 0.5;
    col += c1 * pulse * 0.2;

    return col * intensity;
}

// ---- Lighting ----
vec3 calcLighting(vec3 p, vec3 n, vec3 rd, float dist) {
    // Light positions
    vec3 light1 = vec3(4.0, 6.0, 3.0);
    vec3 light2 = vec3(-3.0, 2.0, -4.0);
    vec3 light3 = vec3(0.0, -2.0, 5.0);

    vec3 col = vec3(0.0);
    vec3 baseColor = cyberColor(dist, n, p);

    // Ambient
    vec3 ambient = baseColor * 0.15;

    // Light 1 - Main cyan light
    vec3 l1 = normalize(light1 - p);
    float diff1 = max(dot(n, l1), 0.0);
    vec3 h1 = normalize(l1 - rd);
    float spec1 = pow(max(dot(n, h1), 0.0), 64.0);
    float shadow1 = softShadow(p, l1, 0.02, length(light1 - p), 16.0);
    col += baseColor * diff1 * 1.2 * shadow1 + vec3(0.0, 0.8, 1.0) * spec1 * shadow1 * 0.8;

    // Light 2 - Magenta rim light
    vec3 l2 = normalize(light2 - p);
    float diff2 = max(dot(n, l2), 0.0);
    vec3 h2 = normalize(l2 - rd);
    float spec2 = pow(max(dot(n, h2), 0.0), 32.0);
    float shadow2 = softShadow(p, l2, 0.02, length(light2 - p), 12.0);
    col += baseColor * diff2 * 0.6 * shadow2 + vec3(1.0, 0.0, 0.6) * spec2 * shadow2 * 0.5;

    // Light 3 - Bottom fill (neon green)
    vec3 l3 = normalize(light3 - p);
    float diff3 = max(dot(n, l3), 0.0);
    col += baseColor * diff3 * 0.3;

    // Ambient occlusion
    float ao = calcAO(p, n);
    col *= ao;

    // Add ambient back
    col += ambient * ao;

    // Fresnel / rim lighting
    float fresnel = pow(1.0 - max(dot(n, -rd), 0.0), 5.0);
    col += vec3(0.0, 0.6, 1.0) * fresnel * 0.4;

    return col;
}

// ---- Ray Marching ----
vec4 rayMarch(vec3 ro, vec3 rd) {
    float t = 0.0;
    float d = 0.0;
    vec3 p = ro;
    float glow = 0.0;

    for (int i = 0; i < MAX_STEPS; i++) {
        p = ro + rd * t;
        d = sceneDE(p);

        // Accumulate glow near the surface
        glow += exp(-d * 8.0) * 0.02;

        if (d < MIN_DIST * t) {
            // Hit
            vec3 n = calcNormal(p);
            vec3 col = calcLighting(p, n, rd, t);

            // Fog
            float fog = exp(-t * t * 0.008);
            col = mix(vec3(0.02, 0.02, 0.05), col, fog);

            return vec4(col, 1.0);
        }

        t += d * 0.8; // Slight under-stepping for better detail
        if (t > MAX_DIST) break;
    }

    // Background / glow
    vec3 bg = vec3(0.01, 0.01, 0.02);
    bg += vec3(0.0, 0.3, 0.5) * glow * u_config.z;

    // Subtle grid in background
    float grid = max(
        smoothstep(0.98, 1.0, abs(sin(rd.x * 20.0 + u_time * 0.1))),
        smoothstep(0.98, 1.0, abs(sin(rd.y * 20.0 + u_time * 0.1)))
    );
    bg += vec3(0.0, 0.2, 0.3) * grid * 0.1;

    return vec4(bg, 0.0);
}

// ---- Main ----
void main() {
    vec2 uv = (v_uv - 0.5) * u_resolution / min(u_resolution.x, u_resolution.y);

    // Camera setup
    vec3 ro = u_cameraPos;
    vec3 ta = u_cameraTarget;
    mat3 cam = lookAt(ro, ta, u_cameraUp);
    vec3 rd = cam * normalize(vec3(uv, -1.5));

    vec4 result = rayMarch(ro, rd);

    // Mode-specific processing
    if (u_mode == 1) {
        // Neon mode - boost saturation and add extra glow
        vec3 hsv = result.rgb;
        float lum = dot(hsv, vec3(0.299, 0.587, 0.114));
        result.rgb = mix(vec3(lum), hsv, 1.5); // Saturate
        result.rgb = pow(result.rgb, vec3(0.8)); // Brighten shadows
    } else if (u_mode == 2) {
        // Wireframe-ish mode - edge detection on distance field
        float edge = 0.0;
        for (float i = 0.0; i < 3.0; i++) {
            vec2 off = vec2(cos(i * 2.094), sin(i * 2.094)) * 0.003;
            edge += abs(sceneDE(ro + rd * (result.a > 0.5 ? 0.0 : 5.0) + cam * vec3(off, 0.0)) - 
                       sceneDE(ro + rd * (result.a > 0.5 ? 0.0 : 5.0)));
        }
        edge = smoothstep(0.0, 0.02, edge);
        result.rgb = mix(vec3(0.0, 0.1, 0.15), vec3(0.0, 0.9, 1.0), edge);
    }

    // Tone mapping
    result.rgb = result.rgb / (1.0 + result.rgb * 0.5);

    // Gamma correction
    result.rgb = pow(result.rgb, vec3(0.4545));

    // Vignette
    float vig = 1.0 - dot(v_uv - 0.5, v_uv - 0.5) * 0.8;
    result.rgb *= vig;

    gl_FragColor = vec4(result.rgb, 1.0);
}
`;

// ---- Post-Processing Fragment Shader ----
const POST_FRAGMENT = `
precision highp float;
uniform sampler2D u_texture;
uniform vec2 u_resolution;
uniform vec4 u_config;
uniform float u_time;
varying vec2 v_uv;

void main() {
    vec2 uv = v_uv;
    vec3 col = texture2D(u_texture, uv).rgb;

    // Bloom / glow extraction
    vec3 bloom = vec3(0.0);
    float bloomStr = u_config.w;

    // Small kernel blur for bloom
    vec2 texel = 1.0 / u_resolution;
    for (float x = -2.0; x <= 2.0; x++) {
        for (float y = -2.0; y <= 2.0; y++) {
            vec2 off = vec2(x, y) * texel * 2.0;
            vec3 sampleCol = texture2D(u_texture, uv + off).rgb;
            float brightness = dot(sampleCol, vec3(0.299, 0.587, 0.114));
            if (brightness > 0.5) {
                bloom += sampleCol * 0.04;
            }
        }
    }

    col += bloom * bloomStr;

    // Chromatic aberration
    float ca = 0.003;
    col.r = texture2D(u_texture, uv + vec2(ca, 0.0)).r * 0.7 + col.r * 0.3;
    col.b = texture2D(u_texture, uv - vec2(ca, 0.0)).b * 0.7 + col.b * 0.3;

    // Scanline effect
    float scanline = sin(uv.y * u_resolution.y * 1.5 + u_time * 2.0) * 0.03;
    col -= scanline;

    // Subtle noise
    float noise = fract(sin(dot(uv * u_time, vec2(12.9898, 78.233))) * 43758.5453);
    col += (noise - 0.5) * 0.015;

    // Final contrast
    col = pow(col, vec3(0.95));

    gl_FragColor = vec4(col, 1.0);
}
`;

// ============================================================
// WEBGL SETUP
// ============================================================

function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error('Shader compile error:', gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
    }
    return shader;
}

function createProgram(gl, vsSource, fsSource) {
    const vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
    const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        console.error('Program link error:', gl.getProgramInfoLog(prog));
        return null;
    }
    return prog;
}

function initWebGL() {
    canvas = document.getElementById('glCanvas');
    gl = canvas.getContext('webgl', { 
        antialias: false, 
        alpha: false,
        preserveDrawingBuffer: false,
        powerPreference: 'high-performance'
    });

    if (!gl) {
        alert('WebGL not supported');
        return;
    }

    // Create fullscreen quad
    const quadData = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
    quadVBO = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadVBO);
    gl.bufferData(gl.ARRAY_BUFFER, quadData, gl.STATIC_DRAW);

    // Create main program
    program = createProgram(gl, VERTEX_SHADER, FRAGMENT_SHADER);
    const posLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    // Get uniforms
    uTime = gl.getUniformLocation(program, 'u_time');
    uResolution = gl.getUniformLocation(program, 'u_resolution');
    uCameraPos = gl.getUniformLocation(program, 'u_cameraPos');
    uCameraTarget = gl.getUniformLocation(program, 'u_cameraTarget');
    uCameraUp = gl.getUniformLocation(program, 'u_cameraUp');
    uConfig = gl.getUniformLocation(program, 'u_config');
    uMode = gl.getUniformLocation(program, 'u_mode');

    // Create post-processing program
    postProgram = createProgram(gl, VERTEX_SHADER, POST_FRAGMENT);
    const postPosLoc = gl.getAttribLocation(postProgram, 'a_position');
    gl.enableVertexAttribArray(postPosLoc);
    gl.vertexAttribPointer(postPosLoc, 2, gl.FLOAT, false, 0, 0);

    postUTexture = gl.getUniformLocation(postProgram, 'u_texture');
    postUResolution = gl.getUniformLocation(postProgram, 'u_resolution');
    postUConfig = gl.getUniformLocation(postProgram, 'u_config');
    postUTime = gl.getUniformLocation(postProgram, 'u_time');

    // Create framebuffer for post-processing
    createFramebuffer();

    resize();
    window.addEventListener('resize', resize);
}

function createFramebuffer() {
    frameBuffer = gl.createFramebuffer();
    frameTexture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, frameTexture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

function resize() {
    const dpr = Math.min(window.devicePixelRatio, 2.0);
    const w = Math.floor(window.innerWidth * dpr);
    const h = Math.floor(window.innerHeight * dpr);

    canvas.width = w;
    canvas.height = h;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';

    gl.viewport(0, 0, w, h);

    // Resize framebuffer texture
    gl.bindTexture(gl.TEXTURE_2D, frameTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);

    document.getElementById('res').textContent = 'RES: ' + w + 'x' + h;
}

// ============================================================
// RENDER LOOP
// ============================================================

function updateCamera(dt) {
    // Smooth interpolation with inertia
    const smooth = 1.0 - Math.exp(-dt * 6.0);

    camera.theta += (camera.targetTheta - camera.theta) * smooth;
    camera.phi += (camera.targetPhi - camera.phi) * smooth;
    camera.radius += (camera.targetRadius - camera.radius) * smooth;

    camera.phi = clamp(camera.phi, 0.1, Math.PI - 0.1);
    camera.radius = Math.max(camera.radius, 0.5);

    // Convert spherical to cartesian
    const st = Math.sin(camera.theta);
    const ct = Math.cos(camera.theta);
    const sp = Math.sin(camera.phi);
    const cp = Math.cos(camera.phi);

    camera.pos[0] = camera.targetCenter[0] + camera.radius * st * sp;
    camera.pos[1] = camera.targetCenter[1] + camera.radius * cp;
    camera.pos[2] = camera.targetCenter[2] + camera.radius * ct * sp;

    // Auto-rotation when idle
    if (!input.mouseDown && !input.rightMouseDown && input.touchCount === 0) {
        camera.targetTheta += dt * CONFIG.zoomSpeed * 0.2;
    }
}

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function render(time) {
    const t = time * 0.001;
    const dt = Math.min(t - lastTime, 0.05);
    lastTime = t;

    // Update FPS
    frameCount++;
    if (t - fpsTime > 1.0) {
        currentFPS = frameCount;
        frameCount = 0;
        fpsTime = t;
        document.getElementById('fps').textContent = 'FPS: ' + currentFPS;
    }

    updateCamera(dt);

    // ---- Pass 1: Render to framebuffer ----
    gl.bindFramebuffer(gl.FRAMEBUFFER, frameBuffer);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, frameTexture, 0);
    gl.useProgram(program);

    gl.uniform1f(uTime, t);
    gl.uniform2f(uResolution, canvas.width, canvas.height);
    gl.uniform3f(uCameraPos, camera.pos[0], camera.pos[1], camera.pos[2]);
    gl.uniform3f(uCameraTarget, camera.targetCenter[0], camera.targetCenter[1], camera.targetCenter[2]);
    gl.uniform3f(uCameraUp, 0, 1, 0);
    gl.uniform4f(uConfig, CONFIG.maxIterations, CONFIG.fractalPower, CONFIG.colorIntensity, CONFIG.bloomStrength);
    gl.uniform1i(uMode, CONFIG.renderMode);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // ---- Pass 2: Post-processing ----
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.useProgram(postProgram);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, frameTexture);
    gl.uniform1i(postUTexture, 0);
    gl.uniform2f(postUResolution, canvas.width, canvas.height);
    gl.uniform4f(postUConfig, CONFIG.maxIterations, CONFIG.fractalPower, CONFIG.colorIntensity, CONFIG.bloomStrength);
    gl.uniform1f(postUTime, t);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    requestAnimationFrame(render);
}

// ============================================================
// INPUT HANDLING
// ============================================================

function initInputs() {
    // Mouse
    document.addEventListener('mousedown', e => {
        if (e.target.closest('#ui-controls') || e.target.closest('#hamburger') || 
            e.target.closest('#owner-btn') || e.target.closest('#login-panel') ||
            e.target.closest('#admin-panel')) return;

        if (e.button === 0) {
            input.mouseDown = true;
        } else if (e.button === 2) {
            input.rightMouseDown = true;
        }
        input.lastX = e.clientX;
        input.lastY = e.clientY;
    });

    document.addEventListener('mouseup', e => {
        if (e.button === 0) input.mouseDown = false;
        if (e.button === 2) input.rightMouseDown = false;
    });

    document.addEventListener('mousemove', e => {
        const dx = e.clientX - input.lastX;
        const dy = e.clientY - input.lastY;

        if (input.mouseDown) {
            camera.targetTheta -= dx * 0.005;
            camera.targetPhi -= dy * 0.005;
        }
        if (input.rightMouseDown) {
            const speed = camera.radius * 0.002;
            camera.targetCenter[0] -= dx * speed * Math.cos(camera.theta);
            camera.targetCenter[2] += dx * speed * Math.sin(camera.theta);
            camera.targetCenter[1] += dy * speed;
        }

        input.lastX = e.clientX;
        input.lastY = e.clientY;
    });

    document.addEventListener('wheel', e => {
        if (e.target.closest('#ui-controls')) return;
        e.preventDefault();
        camera.targetRadius *= Math.exp(e.deltaY * 0.001);
    }, { passive: false });

    document.addEventListener('contextmenu', e => e.preventDefault());

    // Touch
    document.addEventListener('touchstart', e => {
        if (e.target.closest('#ui-controls') || e.target.closest('#hamburger') || 
            e.target.closest('#owner-btn') || e.target.closest('#login-panel') ||
            e.target.closest('#admin-panel')) return;

        input.touchCount = e.touches.length;
        if (e.touches.length === 1) {
            input.lastX = e.touches[0].clientX;
            input.lastY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            input.touchDist = Math.sqrt(dx*dx + dy*dy);
        }
    }, { passive: false });

    document.addEventListener('touchmove', e => {
        if (e.target.closest('#ui-controls')) return;
        e.preventDefault();

        if (e.touches.length === 1 && input.touchCount === 1) {
            const dx = e.touches[0].clientX - input.lastX;
            const dy = e.touches[0].clientY - input.lastY;
            camera.targetTheta -= dx * 0.006;
            camera.targetPhi -= dy * 0.006;
            input.lastX = e.touches[0].clientX;
            input.lastY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            camera.targetRadius *= input.touchDist / dist;
            input.touchDist = dist;

            // Pan with two fingers
            const cx = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
            const cy = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
            const pdx = cx - input.lastX;
            const pdy = cy - input.lastY;
            const speed = camera.radius * 0.001;
            camera.targetCenter[0] -= pdx * speed * Math.cos(camera.theta);
            camera.targetCenter[2] += pdx * speed * Math.sin(camera.theta);
            camera.targetCenter[1] += pdy * speed;
            input.lastX = cx;
            input.lastY = cy;
        }
    }, { passive: false });

    document.addEventListener('touchend', e => {
        input.touchCount = e.touches.length;
    });
}

// ============================================================
// UI CONTROLS
// ============================================================

function initUI() {
    const sliders = {
        'iterations': { key: 'maxIterations', display: 'iter-val', int: true },
        'power': { key: 'fractalPower', display: 'power-val' },
        'color-intensity': { key: 'colorIntensity', display: 'color-val' },
        'zoom-speed': { key: 'zoomSpeed', display: 'zoom-val' },
        'bloom': { key: 'bloomStrength', display: 'bloom-val' }
    };

    for (const [id, cfg] of Object.entries(sliders)) {
        const el = document.getElementById(id);
        const disp = document.getElementById(cfg.display);
        el.addEventListener('input', () => {
            CONFIG[cfg.key] = cfg.int ? parseInt(el.value) : parseFloat(el.value);
            disp.textContent = cfg.int ? CONFIG[cfg.key] : CONFIG[cfg.key].toFixed(2);
        });
    }

    // Mode buttons
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            CONFIG.renderMode = parseInt(btn.dataset.mode);
        });
    });
}

// ============================================================
// HAMBURGER & ADMIN PANEL
// ============================================================

function initAdmin() {
    const hamburger = document.getElementById('hamburger');
    const ownerBtn = document.getElementById('owner-btn');
    const loginPanel = document.getElementById('login-panel');
    const adminPanel = document.getElementById('admin-panel');

    let menuOpen = false;

    hamburger.addEventListener('click', () => {
        menuOpen = !menuOpen;
        ownerBtn.style.display = menuOpen ? 'block' : 'none';
    });

    ownerBtn.addEventListener('click', () => {
        loginPanel.style.display = 'block';
        menuOpen = false;
        ownerBtn.style.display = 'none';
    });

    document.getElementById('login-close').addEventListener('click', () => {
        loginPanel.style.display = 'none';
    });

    document.getElementById('login-submit').addEventListener('click', () => {
        const user = document.getElementById('login-user').value;
        const pass = document.getElementById('login-pass').value;

        if (user === 'velonix4n' && pass === 'Leader_Cipher4n') {
            loginPanel.style.display = 'none';
            adminPanel.style.display = 'block';
            document.getElementById('login-user').value = '';
            document.getElementById('login-pass').value = '';
            document.getElementById('login-error').style.display = 'none';
            renderLinks();
        } else {
            document.getElementById('login-error').style.display = 'block';
        }
    });

    // Add link
    document.getElementById('add-link').addEventListener('click', () => {
        const url = document.getElementById('link-url').value.trim();
        const desc = document.getElementById('link-desc').value.trim();
        const img = document.getElementById('link-img').value.trim();

        if (url) {
            savedLinks.push({ url, desc, img, id: Date.now() });
            localStorage.setItem('cyberfractal_links', JSON.stringify(savedLinks));
            document.getElementById('link-url').value = '';
            document.getElementById('link-desc').value = '';
            document.getElementById('link-img').value = '';
            renderLinks();
        }
    });

    // Clear all
    document.getElementById('clear-links').addEventListener('click', () => {
        savedLinks = [];
        localStorage.setItem('cyberfractal_links', JSON.stringify(savedLinks));
        renderLinks();
    });
}

function renderLinks() {
    const container = document.getElementById('links-container');
    container.innerHTML = '';

    savedLinks.forEach(link => {
        const item = document.createElement('div');
        item.className = 'link-item';
        item.innerHTML = `
            ${link.img ? `<img src="${link.img}" onerror="this.style.display='none'">` : '<div style="width:50px;height:50px;background:rgba(0,255,255,0.1);border:1px solid rgba(0,255,255,0.3);"></div>'}
            <div class="info">
                <div class="title">${link.url}</div>
                <div class="desc">${link.desc || 'No description'}</div>
            </div>
            <button class="delete-btn" data-id="${link.id}">DELETE</button>
        `;
        container.appendChild(item);
    });

    document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = parseInt(btn.dataset.id);
            savedLinks = savedLinks.filter(l => l.id !== id);
            localStorage.setItem('cyberfractal_links', JSON.stringify(savedLinks));
            renderLinks();
        });
    });
}

// ============================================================
// INITIALIZATION
// ============================================================

window.addEventListener('load', () => {
    initWebGL();
    initInputs();
    initUI();
    initAdmin();
    requestAnimationFrame(render);
});
</script>
</body>
